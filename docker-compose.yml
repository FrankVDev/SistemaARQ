# =============================================================================
# NovaSalud V3.2.1 - Despliegue completo con Docker Compose
# Levantar:  docker compose up -d --build
# Detener:   docker compose down        (agregar -v para borrar la BD)
# =============================================================================

# Clave JWT compartida por todos los servicios backend (Citas, Atención,
# Farmacia y Orquestador). Puede sobrescribirse con un archivo .env
x-jwt-secret: &jwt-secret ${NOVASALUD_JWT_SECRET:-NovaSaludSystemSecretKeyHMAC256BitsLongForSecureJwtTokenSigning2026UTP}

x-db-citas: &db-citas
  DB_URL: jdbc:mysql://mysql:3306/bd_citasmedicas_v321?useSSL=false&allowPublicKeyRetrieval=true&noAccessToProcedureBodies=true&serverTimezone=UTC
  DB_USER: usuario_citas
  DB_PASSWORD: ISO/IEC27001
  NOVASALUD_JWT_SECRET: *jwt-secret
  TZ: America/Lima

x-depends-db: &depends-db
  mysql:
    condition: service_healthy

services:

  mysql:
    image: mysql:8.0
    container_name: novasalud-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: America/Lima
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    ports:
      - "3307:3306"   # 3307 para no chocar con un MySQL local
    volumes:
      - mysql-data:/var/lib/mysql
      # Scripts SQL oficiales y script de inicialización con UTF-8.
      # Se ejecutan solo la primera vez (cuando el volumen mysql-data está vacío).
      - ./databaseMysql:/novasalud-sql:ro
      - ./docker/mysql:/novasalud-docker-sql:ro
      - ./docker/mysql/00_init_utf8.sh:/docker-entrypoint-initdb.d/00_init_utf8.sh:ro
    healthcheck:
      # Solo responde cuando la inicialización terminó (usuario '%' creado y TCP activo)
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "usuario_farmacia", "-pFarmacia2026*"]
      interval: 10s
      timeout: 5s
      retries: 30

  citas-api:
    build: { context: ., args: { MODULE: novasalud-citas-api } }
    container_name: novasalud-citas-api
    environment: *db-citas
    ports: ["8084:8080"]
    depends_on: *depends-db

  atencion-api:
    build: { context: ., args: { MODULE: novasalud-atencion-api } }
    container_name: novasalud-atencion-api
    environment: *db-citas
    ports: ["8082:8080"]
    depends_on: *depends-db

  farmacia-api:
    build: { context: ., args: { MODULE: novasalud-farmacia-api } }
    container_name: novasalud-farmacia-api
    environment:
      DB_URL: jdbc:mysql://mysql:3306/bd_famacia?useSSL=false&allowPublicKeyRetrieval=true&noAccessToProcedureBodies=true&serverTimezone=UTC
      DB_USER: usuario_farmacia
      DB_PASSWORD: Farmacia2026*
      NOVASALUD_JWT_SECRET: *jwt-secret
      TZ: America/Lima
    ports: ["8085:8080"]
    depends_on: *depends-db

  orchestrator:
    build: { context: ., args: { MODULE: novasalud-orchestrator } }
    container_name: novasalud-orchestrator
    environment:
      CITAS_API_URL: http://citas-api:8080/novasalud-citas-api/api
      ATENCION_API_URL: http://atencion-api:8080/novasalud-atencion-api/api
      FARMACIA_API_URL: http://farmacia-api:8080/novasalud-farmacia-api/api
      NOVASALUD_JWT_SECRET: *jwt-secret
      TZ: America/Lima
    ports: ["8083:8080"]
    depends_on: [citas-api, atencion-api, farmacia-api]

  citas-web:
    build: { context: ., args: { MODULE: novasalud-citas-web } }
    container_name: novasalud-citas-web
    environment: { TZ: America/Lima }
    ports: ["8080:8080"]
    depends_on: [citas-api, atencion-api, orchestrator]

  farmacia-web:
    build: { context: ., args: { MODULE: novasalud-farmacia-web } }
    container_name: novasalud-farmacia-web
    environment: { TZ: America/Lima }
    ports: ["8081:8080"]
    depends_on: [farmacia-api]

volumes:
  mysql-data:
